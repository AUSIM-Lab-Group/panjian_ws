  adult: 0.40
  child_like: 0.70
  cyclist: 0.60
  vehicle: 0.50
  unknown: 0.40
guard_eta: 0.10
guard_enable: true
guard_tau: 0.20
mpc_horizon: 20
dt: 0.10
random_seed: 1
baselines: [Fixed_margin, SEESM_Ours]
required_artifacts: [front_video, top_video, rviz_recording, rosbag, csv, params, photos]
safety_notes:
  physical_cmd_vel_requires_user_approval: true
  no_child_risk_experiment: true
metrics: [D_min, path_length, travel_time, success, total_loop_time]
status: template
