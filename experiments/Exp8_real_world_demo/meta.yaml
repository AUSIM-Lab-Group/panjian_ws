experiment_id: Exp8_real_world_demo
purpose: Small-scale real-world demonstration under safe, low-risk settings.
scenario: real_world_safe_demo
method: SEESM_Ours
map_name: lab_corridor
start: [0.0, 0.0, 0.0]
goal: [6.0, 0.0, 0.0]
robot_radius: 0.4
obstacle_radius: 0.4
obstacle_count: 2
obstacle_classes: [box, adult_or_dummy]
beta_table:
