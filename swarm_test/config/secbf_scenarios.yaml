        start: {x: 8.0, y: 0.0, z: 0.75}
        goal: {x: 0.0, y: 0.0}
        travel_time: 22.0
        semantic_class: "child_like"
        cooperation_type: "noncooperative"
    goal: {x: 8.0, y: 0.0}
    beta_bar:
      child_like: 1.00
      child: 1.00
      pedestrian: 0.75
      adult: 0.70
      cyclist: 0.90
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
      epsilon_max: 0.01
      slack_weight: 5000.0
    paper_role: "SEESM cooperation-sensitive margin stress for noncooperative frontal encounter"

  avocado_circle:
    description: "AVOCADO-style Circle: robot and agents exchange antipodal circle positions"
    scenario_family: "Circle"
    context_level: "Supplementary"
    scene_source: "AVOCADO-inspired layout"
    map: {x: 12.0, y: 10.0, z: 3.0}
    obstacles:
      - {motion_type: "line", start: {x: 8.0, y: 0.0, z: 0.75}, goal: {x: 0.0, y: 0.0}, travel_time: 26.0,
         semantic_class: "adult", cooperation_type: "cooperative"}
      - {motion_type: "line", start: {x: 6.0, y: 3.46, z: 0.75}, goal: {x: 2.0, y: -3.46}, travel_time: 24.0,
         semantic_class: "pedestrian", cooperation_type: "cooperative"}
      - {motion_type: "line", start: {x: 2.0, y: 3.46, z: 0.75}, goal: {x: 6.0, y: -3.46}, travel_time: 22.0,
         semantic_class: "cyclist", cooperation_type: "partial"}
      - {motion_type: "line", start: {x: 2.0, y: -3.46, z: 0.75}, goal: {x: 6.0, y: 3.46}, travel_time: 24.0,
         semantic_class: "adult", cooperation_type: "cooperative"}
      - {motion_type: "line", start: {x: 6.0, y: -3.46, z: 0.75}, goal: {x: 2.0, y: 3.46}, travel_time: 22.0,
         semantic_class: "child_like", cooperation_type: "noncooperative"}
    goal: {x: 8.0, y: 0.0}
    beta_bar:
      child_like: 1.00
      child: 1.00
      cyclist: 0.90
      pedestrian: 0.75
      adult: 0.70
      unknown: 0.75
    paper_role: "SEESM symmetric-conflict evidence for reciprocal dance and center crowding"

