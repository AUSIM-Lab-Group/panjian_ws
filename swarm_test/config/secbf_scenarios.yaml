# SECBF 实验场景配置
# 老师版主实验矩阵：3 类场景 × 3 个 context level。
# 旧 S1/S2/S3/S4 主场景已退出新实验矩阵，避免重复实验。

scenarios:
  # Main simulation: Head-on
  head_on_context_bl:
    description: "Head-on / Context-BL: one pedestrian, moderate closing speed"
    scenario_family: "Head-on"
    context_level: "Context-BL"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 6.0, y: 0.0, z: 0.75, offset: 0.0, slower: 8.0,
         scale_x: 18.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "low-risk frontal interaction baseline"

  head_on_context_int:
    description: "Head-on / Context-Int: child-like pedestrian, shorter TTC"
    scenario_family: "Head-on"
    context_level: "Context-Int"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 5.2, y: 0.0, z: 0.75, offset: 0.0, slower: 5.5,
         scale_x: 16.5, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child_like"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "category and short-TTC semantic margin"

  head_on_context_ext:
    description: "Head-on / Context-Ext: high-risk child-like obstacle, high semantic margin, short TTC"
    scenario_family: "Head-on"
    context_level: "Context-Ext"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 3.6, y: 0.0, z: 0.75, offset: 0.0, slower: 3.0,
         scale_x: 12.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child_like"}
    goal: {x: 10.0, y: 0.0}
    beta_bar:
      child: 1.05
      child_like: 1.05
      pedestrian: 0.75
      adult: 0.75
      cyclist: 0.90
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
      epsilon_max: 0.01
      slack_weight: 5000.0
    theory:
      delta_bar_beta: 0.3
    expected_role: "feasibility pressure from high beta and short TTC"

  # Main simulation: Crossing
  crossing_context_bl:
    description: "Crossing / Context-BL: one pedestrian crossing with moderate TTC"
    scenario_family: "Crossing"
    context_level: "Context-BL"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 5.4, y: 0.0, z: 0.75, offset: 0.0, slower: 7.0,
         scale_x: 0.0, scale_y: 12.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "single crossing pedestrian baseline"

  crossing_context_int:
    description: "Crossing / Context-Int: cyclist crossing with shorter TTC"
    scenario_family: "Crossing"
    context_level: "Context-Int"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 5.2, y: 0.0, z: 0.75, offset: 0.0, slower: 4.5,
         scale_x: 0.0, scale_y: 12.0, scale_z: 0.0,
         semantic_class: "cyclist"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "short-TTC lateral interaction with higher-risk class"

  crossing_context_ext:
    description: "Crossing / Context-Ext: fast child-like crossing plus static narrowing obstacle"
    scenario_family: "Crossing"
    context_level: "Context-Ext"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 4.8, y: 0.0, z: 0.75, offset: 0.0, slower: 3.2,
         scale_x: 0.0, scale_y: 12.0, scale_z: 0.0,
         semantic_class: "child_like"}
      - {x: 6.8, y: -0.9, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 11.0, y: 0.0}
    beta_bar:
      box: 0.20
      child: 1.05
      child_like: 1.05
      cyclist: 0.90
      pedestrian: 0.75
      adult: 0.75
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
      epsilon_max: 0.01
      slack_weight: 5000.0
    theory:
      delta_bar_beta: 0.3
    expected_role: "short-TTC crossing under corridor narrowing"

  # Main simulation: Local Crowding
  local_crowding_context_bl:
    description: "Local Crowding / Context-BL: three low-speed obstacles near the path"
    scenario_family: "Local Crowding"
    context_level: "Context-BL"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 4.6, y: -1.0, z: 0.75, offset: 0.0, slower: 9.0,
         scale_x: 8.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
      - {x: 6.2, y: 1.0, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
      - {x: 7.4, y: -1.1, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "low-density crowding baseline"

  local_crowding_context_int:
    description: "Local Crowding / Context-Int: two pedestrians, cyclist, and static box create local density"
    scenario_family: "Local Crowding"
    context_level: "Context-Int"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 4.8, y: -1.0, z: 0.75, offset: 0.0, slower: 6.0,
         scale_x: 10.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
      - {x: 5.6, y: 0.0, z: 0.75, offset: 0.0, slower: 5.0,
         scale_x: 0.0, scale_y: 10.0, scale_z: 0.0,
         semantic_class: "cyclist"}
      - {x: 7.2, y: 0.9, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
      - {x: 6.7, y: -1.2, z: 0.75, offset: 0.0, slower: 7.0,
         scale_x: 7.5, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
    goal: {x: 12.0, y: 0.0}
    expected_role: "medium-density mixed semantic pressure"

  local_crowding_context_ext:
    description: "Local Crowding / Context-Ext: five-agent dense short-TTC crowd with high semantic margins"
    scenario_family: "Local Crowding"
    context_level: "Context-Ext"
    map: {x: 14.0, y: 8.0, z: 3.0}
    obstacles:
      - {x: 3.8, y: 0.0, z: 0.75, offset: 0.0, slower: 3.8,
         scale_x: 11.4, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child_like"}
      - {x: 5.1, y: 0.0, z: 0.75, offset: 0.0, slower: 3.8,
         scale_x: 0.0, scale_y: 11.0, scale_z: 0.0,
         semantic_class: "cyclist"}
      - {x: 6.4, y: -0.9, z: 0.75, offset: 0.0, slower: 5.0,
         scale_x: 8.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
      - {x: 7.4, y: 0.8, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
      - {x: 8.2, y: -1.2, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 10.5, y: 0.0}
    beta_bar:
      box: 0.20
      child: 1.05
      child_like: 1.05
      cyclist: 0.90
      pedestrian: 0.75
      adult: 0.75
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
      epsilon_max: 0.01
      slack_weight: 5000.0
    theory:
      delta_bar_beta: 0.3
    expected_role: "high-density feasibility and semantic-bound stress"

  # Nested runtime/stability scaling scenes. Larger cases retain all earlier obstacles.
  runtime_scaling_n1:
    description: "Runtime/stability scaling N_obs=1"
    scenario_family: "Runtime Scaling"
    context_level: "N1"
    map: {x: 14.0, y: 8.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 4.8, y: -1.0, z: 0.75, offset: 0.0, slower: 6.0, scale_x: 10.0, scale_y: 0.0, scale_z: 0.0, semantic_class: "pedestrian"}
    goal: {x: 12.0, y: 0.0}

  runtime_scaling_n2:
    description: "Runtime/stability scaling N_obs=2"
    scenario_family: "Runtime Scaling"
    context_level: "N2"
    map: {x: 14.0, y: 8.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 4.8, y: -1.0, z: 0.75, offset: 0.0, slower: 6.0, scale_x: 10.0, scale_y: 0.0, scale_z: 0.0, semantic_class: "pedestrian"}
      - {x: 5.6, y: 0.0, z: 0.75, offset: 0.0, slower: 5.0, scale_x: 0.0, scale_y: 10.0, scale_z: 0.0, semantic_class: "cyclist"}
