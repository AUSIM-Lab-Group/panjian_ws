# SECBF 实验场景配置
# 4 个社交导航场景 + 3 种对比基线

scenarios:
  # S1: 行人对向穿越
  S1_pedestrian_crossing:
    description: "1 pedestrian crossing head-on at 1.0 m/s"
    obstacles:
      - {x: 10.0, y: 0.0, z: 0.75, offset: 0.0, slower: 10.0,
         scale_x: -20.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
    goal: {x: 20.0, y: 0.0}
    expected_beta: 0.4  # β̄(pedestrian) × μ(frontal≈0.95)

  # S2: 儿童突然出现 (从侧面突入)
  S2_child_sudden:
    description: "1 child appearing from side at 0.8 m/s"
    obstacles:
      - {x: 8.0, y: 3.0, z: 0.5, offset: 0.0, slower: 8.0,
         scale_x: 0.0, scale_y: -6.0, scale_z: 0.0,
         semantic_class: "child"}
    goal: {x: 15.0, y: 0.0}
    expected_beta: 0.7  # β̄(child) × μ(lateral)

  # S3: Feasibility-Critical (Guard 必须触发)
  S3_feasibility_critical:
    description: "1 child head-on at 1.5 m/s, initial 5m. Guard triggers at h_EE≈0.4"
    obstacles:
      - {x: 5.0, y: 0.0, z: 0.5, offset: 0.0, slower: 3.33,
         scale_x: -10.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child"}
    goal: {x: 15.0, y: 0.0}
    expected_beta_hat: 0.67  # 0.7 × 0.95 (frontal)
    guard_trigger_condition: "β̂(0.67) > h_EE(0.4) - η(0.1) = 0.3 → Guard triggers"
    verification:
      B2_expected: "h enters negative (no Guard, β too large for feasibility)"
      B3_expected: "Guard rollback keeps h > theoretical_bound"

  # S3-stress: Guard/MPC feasibility 消融压力测试
  # fixed-poses simulator uses A=scale_x/6 and v≈-2A/slower.
  # This starts near x≈2.2m with about 1.6m/s closing speed.
  S3_feasibility_stress:
    description: "stress: child-like short-TTC head-on obstacle, high semantic beta, tight MPC slack"
    map: {x: 12.0, y: 6.0, z: 3.0}
    obstacles:
      - {x: 0.0, y: 0.0, z: 0.75, offset: 0.0, slower: 2.75,
         scale_x: 13.2, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child_like"}
    goal: {x: 10.0, y: 0.0}
    beta_bar:
      child: 1.05
      child_like: 1.05
      cyclist: 0.90
      pedestrian: 0.75
      adult: 0.75
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
      epsilon_max: 0.01
      slack_weight: 5000.0
    expected_beta_hat: 1.0
    guard_trigger_condition: "short-TTC β̂ can exceed h_EE-η; projection/rate-limit/MPC guard should keep β feasible"
    theory:
      delta_bar_beta: 0.3

  # S4: 混合场景 (行人 + 车辆 + 纸箱)
  S4_mixed:
    description: "pedestrian + vehicle + box, different β for each"
    obstacles:
      - {x: 6.0, y: -1.0, z: 0.75, offset: 5.0, slower: 8.0,
         scale_x: 15.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "pedestrian"}
      - {x: 12.0, y: 1.5, z: 0.75, offset: 0.0, slower: 6.0,
         scale_x: -12.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "vehicle"}
      - {x: 8.0, y: 0.0, z: 0.3, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 20.0, y: 0.0}

  # Exp2: 类别感知单障碍物 sweep，固定几何与运动，只改变类别
  Exp2_category_box:
    description: "Exp2 category-aware sanity: single static box on path"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 6.0, y: 0.0, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 12.0, y: 0.0}

  Exp2_category_adult:
    description: "Exp2 category-aware sanity: single static adult on path"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 6.0, y: 0.0, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "adult"}
    goal: {x: 12.0, y: 0.0}

  Exp2_category_child_like:
    description: "Exp2 category-aware sanity: single static child-like obstacle on path"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 6.0, y: 0.0, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "child_like"}
    goal: {x: 12.0, y: 0.0}

  Exp2_category_cyclist:
    description: "Exp2 category-aware sanity: single static cyclist on path"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 6.0, y: 0.0, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "cyclist"}
    goal: {x: 12.0, y: 0.0}

  # Exp3: 上下文调制 sweep，固定 adult 类别和单障碍物，只改变运动上下文
  Exp3_context_static:
    description: "Exp3 context modulation: adult static off the path"
    context: "static"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 6.0, y: 2.8, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "adult"}
    goal: {x: 12.0, y: 0.0}

  Exp3_context_same_direction:
    description: "Exp3 context modulation: adult moving with the robot direction"
    context: "same_direction"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 5.0, y: 2.8, z: 0.5, offset: 0.0, slower: 10.0,
         scale_x: 12.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "adult"}
    goal: {x: 12.0, y: 0.0}

  Exp3_context_crossing:
    description: "Exp3 context modulation: adult crossing the robot path"
    context: "crossing"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 4.0, y: -2.8, z: 0.5, offset: 1.5708, slower: 1.5,
         scale_x: 0.0, scale_y: 7.0, scale_z: 0.0,
         semantic_class: "adult"}
    goal: {x: 12.0, y: 0.0}

  Exp3_context_frontal_approaching:
    description: "Exp3 context modulation: adult approaching frontally"
    context: "frontal_approaching"
    map: {x: 12.0, y: 6.0, z: 3.0}
    start: {x: 0.0, y: 0.0}
    obstacles:
      - {x: 7.5, y: 0.0, z: 0.5, offset: 0.0, slower: 5.0,
         scale_x: -6.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "adult"}
    goal: {x: 12.0, y: 0.0}

# 对比基线
baselines:
  B1_ACBF_fixed:
    description: "Original ACBF with fixed safe_dist=0.7m"
    launch: "acbf0_planner.launch"
    controller: 4

  B2_SECBF_no_guard:
    description: "MPC-SECBF without Guard (β̂ applied directly)"
    launch: "secbf_planner.launch"
    guard_enabled: false

  B3_SECBF_with_guard:
    description: "MPC-SECBF with Guard (proposed method)"
    launch: "secbf_planner.launch"
    guard_enabled: true

# 评价指标
metrics:
  - arrival_time_s        # 到达目标时间
  - min_distance_m        # 最小障碍物距离
  - avg_speed_ms          # 平均速度
  - h_min                 # CBF 值最小值
  - guard_rollback_count  # Guard 回退次数
  - beta_mean             # β 平均值
