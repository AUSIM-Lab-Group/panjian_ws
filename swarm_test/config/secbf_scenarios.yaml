      - {x: 6.8, y: -0.9, z: 0.5, offset: 0.0, slower: 999.0,
         scale_x: 0.0, scale_y: 0.0, scale_z: 0.0,
         semantic_class: "box"}
    goal: {x: 11.0, y: 0.0}
    beta_bar:
      box: 0.20
      child: 1.05
      child_like: 1.05
      cyclist: 0.90
      pedestrian: 0.75
      adult: 0.75
      vehicle: 0.80
      unknown: 0.75
    experiment_switches:
