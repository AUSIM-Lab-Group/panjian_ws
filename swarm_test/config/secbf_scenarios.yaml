      - {x: 5.6, y: 0.0, z: 0.75, offset: 0.0, slower: 5.0, scale_x: 0.0, scale_y: 10.0, scale_z: 0.0, semantic_class: "cyclist"}
      - {x: 6.7, y: -1.2, z: 0.75, offset: 0.0, slower: 7.0, scale_x: 7.5, scale_y: 0.0, scale_z: 0.0, semantic_class: "pedestrian"}
      - {x: 7.8, y: 1.1, z: 0.75, offset: 3.14159, slower: 7.5, scale_x: 0.0, scale_y: 8.0, scale_z: 0.0, semantic_class: "child_like"}
      - {x: 8.8, y: -1.0, z: 0.75, offset: 3.14159, slower: 8.0, scale_x: 6.0, scale_y: 0.0, scale_z: 0.0, semantic_class: "pedestrian"}
      - {x: 9.6, y: 1.0, z: 0.75, offset: 0.0, slower: 8.5, scale_x: 0.0, scale_y: 7.0, scale_z: 0.0, semantic_class: "cyclist"}
    goal: {x: 12.0, y: 0.0}

  # Supplementary paper-style scenes: AVOCADO/DR-MPC inspired layouts.
  # 这些场景只借用二维几何视觉表达，不作为对原论文算法的复现。
  avocado_head_on_coop:
    description: "AVOCADO-style Head-on: robot exchanges position with one cooperative counterpart"
    scenario_family: "Head-on Exchange"
    context_level: "Supplementary"
    scene_source: "AVOCADO-inspired layout"
    map: {x: 10.0, y: 6.0, z: 3.0}
    obstacles:
      - motion_type: "line"
        start: {x: 8.0, y: 0.0, z: 0.75}
        goal: {x: 0.0, y: 0.0}
        travel_time: 24.0
        semantic_class: "adult"
        cooperation_type: "cooperative"
    goal: {x: 8.0, y: 0.0}
    paper_role: "SEESM parameter sanity check under cooperative reciprocal yielding"

  avocado_head_on_noncoop:
    description: "AVOCADO-style Head-on: robot exchanges position with one noncooperative agent"
    scenario_family: "Head-on Exchange"
    context_level: "Supplementary"
    scene_source: "AVOCADO-inspired layout"
    map: {x: 10.0, y: 6.0, z: 3.0}
    obstacles:
