# ============================================================================
# 全局路径规划性能分析报告
# ============================================================================
# 
# 指标说明与计算方法：
#
# 1. 规划搜索时间 (Search Time)
#    - 计算方法: 当前路径发布时间 - 上次路径发布时间
#    - 意义: 反映路径规划算法的计算效率，时间越短越好
#    - 单位: 秒(s)
#
# 2. 速度方差 (Velocity Variance) 
#    - 计算方法: 路径上相邻点间速度的方差 Var(v_i), v_i = ||p_{i+1} - p_i|| / dt
#    - 意义: 反映路径速度变化的剧烈程度，方差越小路径越平滑
#    - 单位: (m/s)²
#
# 3. 角速度方差 (Angular Velocity Variance)
#    - 计算方法: 路径上相邻段角度变化率的方差 Var(ω_i), ω_i = (θ_{i+1} - θ_i) / dt  
#    - 意义: 反映路径转向的平滑程度，方差越小转向越平滑
#    - 单位: (rad/s)²
#
# 4. 全局最小安全距离 (Global Minimum Safety Distance)
#    - 计算方法: min(||p_traj - p_obs|| - r_robot - r_obs) 对所有轨迹点和障碍物
#    - 意义: 轨迹与障碍物最近的有效间距，距离越大越安全
#    - 单位: 米(m)
#
# 5. ISAD评分 (Improved Safety Average Distance Score)
#    - 计算方法: 考虑相对速度权重和时间衰减的加权平均安全距离，归一化到[0,1]
#    - 意义: 综合安全评分，1表示非常安全，0表示危险，考虑了动态因素
#    - 单位: 无量纲 [0,1]
#
# 6. 路径长度 (Path Length)
#    - 计算方法: 路径上的离散点数量
#    - 意义: 反映路径的详细程度和覆盖范围
#    - 单位: 个数
#
# ============================================================================

