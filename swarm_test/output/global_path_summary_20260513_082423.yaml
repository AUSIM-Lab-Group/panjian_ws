# ============================================================================
# 全局路径重规划性能分析报告
# ============================================================================
#
# 指标说明:
#   search_time_seconds: 重规划真实搜索时间(秒) - 来自C++规划器
#   velocity_variance: 路径速度方差 (m/s)²
#   angular_velocity_variance: 路径角速度方差 (rad/s)²
#   min_obstacle_distance_meters: 与障碍物最小安全距离(米)
#   global_average_distance_meters: 前20个轨迹点与障碍物平均距离(米)
#   isad_score: 改进安全平均距离评分 [0,1]
#   success_rate_percentage: 重规划成功率(%) = 成功次数/总次数
#
# 过滤规则:
#   - 平均距离超过6m的障碍物不计入统计
#   - 最小距离为负值时标记为失败重规划
#   - 成功率 = 无碰撞重规划次数 / 总重规划次数
# ============================================================================

