# Semantic Safety Margin Configuration (v7 standard)
semantic_safety:
  enabled: true

  # Teacher-v1 category prior B_bar(c) [m]
  beta_bar:
    pedestrian: 0.75
    adult: 0.75
    child: 1.05
    child_like: 1.05
    cyclist: 0.90
    vehicle: 0.80
    box: 0.20
    unknown: 0.75

  # Independent beta_max(c) table. The manuscript omits its values; T2
  # provisionally freezes them equal to B_bar(c), without conflating the keys.
  beta_max:
    pedestrian: 0.75
    adult: 0.75
    child: 1.05
    child_like: 1.05
    cyclist: 0.90
    vehicle: 0.80
    box: 0.20
    unknown: 0.75

  # 上下文调制系数 μ(φ) = clip(bias + w_head*f + w_ttc*t + w_density*d, 0, 1)
  mu_weights:
    bias: 0.6
    heading: 0.2
    ttc: 0.15
    density: 0.1

  # F06/F07 provisional parameters pending teacher confirmation.
  guard:
    h_min: 0.10
    delta_beta_positive: 0.30

  # 机器人参数
  robot:
    radius: 0.4           # 机器人半径 R_robot [m]

  # CBF 参数 (传给 MPC-SECBF)
  cbf:
    gamma: 0.35
    tau_scale: 0.30
